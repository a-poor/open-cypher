# cargo-mutants configuration.
#
# The list below names mutants that were individually triaged and VERIFIED
# EQUIVALENT: each was applied by hand and survived the full test suite plus
# large differential query corpora, with a written justification (see the
# mutation-triage test files under tests/ and the PR history for details).
# Typical reasons: error-path guards where both variants produce the same
# parse error, min/max ties, and states unreachable by construction.
#
# The generated LALRPOP module is kept out of the run by the
# `#[cfg_attr(mutants, mutants::skip)]` marker on `mod generated;` in
# src/parser.rs (plus `--exclude 'src/generated/**'` in mutation.yml as a
# fallback). cargo-mutants 27.x walks every module for mutants *before*
# applying path excludes, and walking the 5 MB generated file costs minutes
# per invocation (391 s per CI shard); the skip marker stops it from loading
# the file at all, so `cargo mutants --list` finishes in well under a second.
#
# MAINTENANCE: entries pin exact file:line:col positions, so they go stale
# when the surrounding code shifts. After editing src/parser.rs (or the other
# listed files), re-run `cargo mutants --list` and refresh the line numbers;
# a stale entry simply stops matching (the mutant reappears as MISSED) - it
# never hides a new mutant.

exclude_re = [
    'src/diagnostic\.rs:478:18: replace > with >= in floor_char_boundary',
    'src/parser\.rs:901:46: replace > with >= in pattern_comprehension_end',
    'src/parser\.rs:1868:40: replace && with \|\| in parameter',
    'src/parser\.rs:528:19: replace == with != in normalize_diagnostics',
    'src/parser\.rs:530:29: replace == with != in normalize_diagnostics',
    'src/parser\.rs:93:26: replace \|\| with && in parse_recovering',
    'src/parser\.rs:93:29: delete ! in parse_recovering',
    'src/span\.rs:78:27: replace < with <= in Span::cover',
    'src/span\.rs:83:25: replace > with >= in Span::cover',
    'src/parser\.rs:2084:13: delete match arm TokenKind::LeftParen in top_level_pipe_candidates',
    'src/parser\.rs:2084:49: replace \+= with \*= in top_level_pipe_candidates',
    'src/parser\.rs:2086:13: delete match arm TokenKind::LeftBrace in top_level_pipe_candidates',
    'src/parser\.rs:2086:44: replace \+= with \*= in top_level_pipe_candidates',
    'src/parser\.rs:2088:32: replace match guard brackets == 1 && parentheses == 0 && braces == 0 with true in top_level_pipe_candidates',
    'src/parser\.rs:2088:46: replace && with \|\| in top_level_pipe_candidates',
    'src/parser\.rs:2088:66: replace && with \|\| in top_level_pipe_candidates',
    'src/parser\.rs:2105:44: replace && with \|\| in parse_comprehension_tokens',
    'src/parser\.rs:2109:43: replace && with \|\| in parse_comprehension_tokens',
    'src/parser\.rs:2116:36: replace \+ with - in parse_comprehension_tokens',
    'src/parser\.rs:2116:36: replace \+ with \* in parse_comprehension_tokens',
    'src/parser\.rs:2116:40: replace < with <= in parse_comprehension_tokens',
    # The comprehension classifier only emits a `pattern comprehension` token
    # when a projection expression precedes the closing bracket, so the
    # empty-projection guard `pipe + 1 >= outer_end` is unreachable; mutating
