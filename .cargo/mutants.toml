# cargo-mutants configuration.
#
# The list below names mutants that were individually triaged and VERIFIED
# EQUIVALENT: each was applied by hand and survived the full test suite plus
# large differential query corpora, with a written justification (see the
# mutation-triage test files under tests/ and the PR history for details).
# Typical reasons: error-path guards where both variants produce the same
# parse error, min/max ties, and states unreachable by construction.
#
# The generated LALRPOP module is kept out of the run by the
# `#[cfg_attr(mutants, mutants::skip)]` marker on `mod generated;` in
# src/parser.rs (plus `--exclude 'src/generated/**'` in mutation.yml as a
# fallback). cargo-mutants 27.x walks every module for mutants *before*
# applying path excludes, and walking the 5 MB generated file costs minutes
# per invocation (391 s per CI shard); the skip marker stops it from loading
# the file at all, so `cargo mutants --list` finishes in well under a second.
#
# MAINTENANCE: entries pin exact file:line:col positions, so they go stale
# when the surrounding code shifts. After editing src/parser.rs (or the other
# listed files), re-run `cargo mutants --list` and refresh the line numbers;
# a stale entry simply stops matching (the mutant reappears as MISSED) - it
# never hides a new mutant.

exclude_re = [
    'src/diagnostic\.rs:478:18: replace > with >= in floor_char_boundary',
    'src/parser\.rs:922:46: replace > with >= in pattern_comprehension_end',
    'src/parser\.rs:1889:40: replace && with \|\| in parameter',
