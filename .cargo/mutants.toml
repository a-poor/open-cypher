    'src/parser\.rs:2143:30: replace \+ with \* in parse_comprehension_tokens',
    'src/parser\.rs:2143:34: replace < with <= in parse_comprehension_tokens',
    'src/parser\.rs:2347:37: replace < with <= in nested_parser_tokens',
    'src/parser\.rs:2446:13: delete match arm ParserToken::LeftBrace in find_top_level_token',
    'src/parser\.rs:2446:46: replace \+= with \*= in find_top_level_token',
    'src/parser\.rs:1153:19: replace > with >= in relationship_label_end',
