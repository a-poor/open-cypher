    'src/parser\.rs:2138:13: replace \+ with - in parse_comprehension_tokens',
    'src/parser\.rs:2138:13: replace \+ with \* in parse_comprehension_tokens',
    'src/parser\.rs:2143:24: replace match guard index \+ 1 < pipe with true in parse_comprehension_tokens',
