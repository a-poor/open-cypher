[package]
name = "open-cypher"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Austin Poor <code@austinpoor.com>"]
description = "An unofficial Rust parser for the openCypher query language."
documentation = "https://docs.rs/open-cypher"
readme = "README.md"
homepage = "https://github.com/a-poor/open-cypher"
repository = "https://github.com/a-poor/open-cypher"
license = "Apache-2.0"
keywords = ["sql", "cypher", "graph", "parser"]
categories = ["parser-implementations"]
autobins = false

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
lalrpop-util = { version = "0.23.1", default-features = false, features = ["std"] }
logos = "0.16.1"
serde = { version = "1.0.219", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest = "1.7.0"
serde_json = "1.0.140"

[[bench]]
name = "parser"
harness = false

[lints.rust]
# `cfg(mutants)` is only referenced by the `#[cfg_attr(mutants, mutants::skip)]`
# marker on the generated grammar module in src/parser.rs; nothing sets it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mutants)"] }
