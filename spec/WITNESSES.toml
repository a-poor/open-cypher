schema_version = 1

# These cases make the policy ledger executable. `baseline` records the
# openCypher 2024.3 BNF expectation; `expect` records the current implementation
# expectation. A difference is allowed only through a reviewed deviation.
# Production-level positive and negative cases will reuse this catalog as the
# 377-production audit progresses.

[[case]]
id = "standalone-return-positive"
description = "The TCK-supported standalone RETURN clarification parses."
baseline = "accept"
entrypoint = "parser"
source = "RETURN 1 AS value"
expect = "accept"

[[case]]
id = "standalone-return-negative"
description = "A standalone RETURN still requires a projection."
baseline = "reject"
entrypoint = "parser"
source = "RETURN"
expect = "reject"

[[case]]
id = "comments-positive"
description = "Nested block and trailing line comments are accepted as trivia."
baseline = "reject"
entrypoint = "parser"
source = "RETURN /* outer /* nested */ outer */ 1 // trailing comment\n"
expect = "accept"

[[case]]
id = "comments-negative"
description = "An unterminated block comment is rejected."
baseline = "reject"
entrypoint = "parser"
source = "RETURN /* unterminated"
expect = "reject"
diagnostics = ["OCY-L004"]

[[case]]
id = "path-mode-positive"
description = "The accepted TRAIL path-mode extension parses."
baseline = "reject"
entrypoint = "parser"
source = "MATCH TRAIL p = (a)-[]->{1,3}(b) RETURN p"
