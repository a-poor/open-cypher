description = "A double-quoted character sequence exercises doubled delimiters and a backslash escape."
baseline = "accept"
entrypoint = "parser"
source = '''RETURN "a""b", "line\n"'''
expect = "accept"

[[case]]
id = "double-quoted-string-negative"
description = "An unterminated double-quoted character sequence is rejected."
baseline = "reject"
entrypoint = "parser"
source = '''RETURN "unterminated'''
expect = "reject"

[[case]]
id = "unary-sign-positive"
description = "Baseline unary plus and unary minus each parse once before an operand."
baseline = "accept"
entrypoint = "parser"
source = "RETURN +1, -2"
expect = "accept"

[[case]]
id = "unary-sign-negative"
description = "A baseline unary sign requires a following operand."
baseline = "reject"
entrypoint = "parser"
source = "RETURN +"
expect = "reject"

[[case]]
id = "binary-digit-positive"
description = "The binary digit terminals 0 and 1 each lex as decimal integer tokens."
baseline = "accept"
entrypoint = "lexer"
source = "0 1"
expect = "tokens"
tokens = ["Integer", "Whitespace", "Integer"]

[[case]]
id = "is-colon-label-negative"
description = "IS label expressions reject node-style colon conjunctions in node and relationship contexts."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n IS A:B)-[r IS C:D]->() RETURN n"
expect = "reject"

[[case]]
id = "mixed-node-label-negative"
description = "A legacy colon chain cannot be mixed with a boolean-disjunction node label."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n:A:B|C) RETURN n"
expect = "reject"

[[case]]
id = "mixed-node-label-malformed-negative"
description = "A mixed node label expression requires a label after its disjunction."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n:A:B|) RETURN n"
expect = "reject"

[[case]]
id = "boolean-node-label-positive"
description = "A baseline colon-prefixed boolean node label disjunction parses without a legacy colon chain."
baseline = "accept"
entrypoint = "parser"
source = "MATCH (n:A|B) RETURN n"
expect = "accept"

[[case]]
id = "pattern-expression-positive"
description = "A simple path pattern parses in value-expression position."
baseline = "accept"
entrypoint = "parser"
source = "RETURN (a)-->(b)"
expect = "accept"

[[case]]
id = "pattern-expression-negative"
description = "A pattern expression rejects an unterminated relationship detail."
baseline = "reject"
entrypoint = "parser"
source = "RETURN (a)-[r"
expect = "reject"

[[case]]
id = "legacy-shortest-multihop-pattern-negative"
description = "A legacy shortest-path pattern is restricted to one relationship hop."
baseline = "reject"
entrypoint = "parser"
source = "MATCH p = shortestPath((a)-->(b)-->(c)) RETURN p"
expect = "reject"

[[case]]
id = "legacy-shortest-multihop-expression-negative"
description = "A shortestPath value expression is restricted to one relationship hop."
baseline = "reject"
entrypoint = "parser"
source = "RETURN shortestPath((a)-->(b)-->(c))"
expect = "reject"

[[case]]
id = "empty-pattern-properties-extension-positive"
description = "Empty node and relationship property maps parse in graph/subquery/update patterns, pattern expressions/comprehensions, and legacy shortest paths."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n {})-[r {}]->(m) CREATE (a {})-[s {}]->(b) MERGE (c {})-[t {}]->(d) RETURN (e {})-[u {}]->(f), [(g {})-[v {}]->(h) | g], shortestPath((i {})-[w {}]->(j)), EXISTS { (k {})-[x {}]->(l) }"
expect = "accept"

[[case]]
id = "empty-pattern-properties-boundary-negative"
description = "An empty-map extension still rejects an unterminated pattern property map."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n {) RETURN n"
expect = "reject"

[[case]]
id = "parameter-continuation-start-positive"
description = "An extended parameter identifier may begin with the XID_CONTINUE-only U+0301 combining acute accent."
baseline = "accept"
entrypoint = "parser"
source = "RETURN $\u0301"
expect = "accept"

[[case]]
id = "parameter-invalid-start-negative"
description = "A parameter name rejects U+200B, which is not an identifier-continue character."
baseline = "reject"
entrypoint = "parser"
source = "RETURN $\u200B"
expect = "reject"

[[case]]
id = "create-parameter-properties-positive"
description = "CREATE accepts general parameters as node and relationship element property specifications."
baseline = "accept"
entrypoint = "parser"
source = "CREATE (a $nodeProps)-[r:R $relationshipProps]->(b)"
expect = "accept"

[[case]]
id = "pattern-parameter-properties-extension-positive"
description = "Bare parameter properties parse on nodes and relationships in graph, subquery, and update patterns for semantic validation."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n $matchNode)-[r:R $matchRel]->(m) CREATE (a $createNode)-[s:S $createRel]->(b) MERGE (c $mergeNode)-[t:T $mergeRel]->(d) RETURN EXISTS { (e $subNode)-[u:U $subRel]->(f) }"
expect = "accept"

[[case]]
id = "pattern-parameter-properties-boundary-negative"
description = "The parameter-property extension still allows at most one property specification per element."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n $first $second) RETURN n"
expect = "reject"

[[case]]
id = "call-union-explicit-positive"
description = "A procedure call with an explicit argument list may participate in a UNION composite statement."
baseline = "accept"
entrypoint = "parser"
source = "CALL foo() UNION RETURN 1"
expect = "accept"

[[case]]
id = "standalone-call-union-negative"
description = "A standalone implicit-argument CALL cannot leak into a UNION composite statement."
baseline = "reject"
entrypoint = "parser"
source = "CALL foo UNION RETURN 1"
expect = "reject"

[[case]]
id = "nested-call-explicit-positive"
description = "A procedure call with explicit arguments may appear inside an EXISTS subquery."
baseline = "accept"
entrypoint = "parser"
source = "RETURN EXISTS { CALL foo() RETURN 1 }"
expect = "accept"

[[case]]
id = "nested-standalone-call-negative"
description = "A standalone implicit-argument CALL cannot leak into an EXISTS subquery."
baseline = "reject"
entrypoint = "parser"
source = "RETURN EXISTS { CALL foo }"
expect = "reject"

[[case]]
id = "split-left-arrow-positive"
description = "A left arrowhead and arrow line may be separated by whitespace and a comment."
baseline = "accept"
entrypoint = "parser"
source = "MATCH (a)< /* split */ -[r:R]-(b) RETURN r"
expect = "accept"

[[case]]
id = "split-right-arrow-positive"
description = "An arrow line and right arrowhead may be separated by whitespace and a comment."
baseline = "accept"
entrypoint = "parser"
source = "MATCH (a)-[r:R]- /* split */ > (b) RETURN r"
expect = "accept"

[[case]]
id = "pattern-expression-relationship-graph-quantifier-negative"
description = "A simple path pattern in expression position cannot graph-quantify its relationship."
baseline = "reject"
entrypoint = "parser"
source = "RETURN (a)-->{1,3}(b)"
expect = "reject"

[[case]]
id = "pattern-expression-node-graph-quantifier-negative"
description = "A simple path pattern in expression position cannot graph-quantify its node."
baseline = "reject"
entrypoint = "parser"
source = "RETURN (a){2}-->(b)"
expect = "reject"

[[case]]
id = "pattern-comprehension-graph-quantifier-negative"
description = "A pattern-comprehension source is a simple path and cannot use a graph quantifier."
baseline = "reject"
entrypoint = "parser"
source = "RETURN [(a)-->{1,3}(b) | b]"
expect = "reject"

[[case]]
id = "legacy-shortest-pattern-graph-quantifier-negative"
description = "A legacy shortest-path pattern cannot use a graph quantifier after its relationship."
baseline = "reject"
entrypoint = "parser"
source = "MATCH p = shortestPath((a)-->{1,3}(b)) RETURN p"
expect = "reject"

[[case]]
id = "legacy-shortest-expression-graph-quantifier-negative"
description = "A legacy shortest-path expression cannot use a graph quantifier after its relationship."
baseline = "reject"
entrypoint = "parser"
source = "RETURN shortestPath((a)-->{1,3}(b))"
expect = "reject"

[[case]]
id = "legacy-shortest-length-positive"
description = "A legacy shortest-path relationship keeps its bracketed legacy length quantifier."
baseline = "accept"
entrypoint = "parser"
source = "RETURN shortestPath((a)-[*1..3]->(b))"
expect = "accept"

[[case]]
id = "relationship-label-boolean-positive"
description = "A relationship pattern accepts a pure IS-prefixed boolean label expression."
baseline = "accept"
entrypoint = "parser"
source = "MATCH ()-[r IS (A | B) & !C]->() RETURN r"
expect = "accept"

[[case]]
id = "relationship-label-mixed-legacy-boolean-negative"
description = "A legacy relationship |: label list cannot be mixed with boolean conjunction syntax."
baseline = "reject"
entrypoint = "parser"
source = "MATCH ()-[r:A|:B&C]->() RETURN r"
expect = "reject"

[[case]]
id = "label-predicate-boolean-positive"
description = "Generic expression predicates accept pure colon- and IS-prefixed boolean label expressions."
baseline = "accept"
entrypoint = "parser"
source = "MATCH (n) RETURN n:A|B AS colon_form, n IS A&B AS is_form"
expect = "accept"

[[case]]
id = "label-predicate-colon-chain-extension-positive"
description = "A generic expression accepts node- and relationship-style repeated-colon legacy label predicates."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n) RETURN n:A:B AS conjunction, n:A|:B AS disjunction"
expect = "accept"

[[case]]
id = "label-predicate-legacy-boundary-negative"
description = "A generic expression cannot mix relationship-style |: legacy labels with boolean conjunction."
baseline = "reject"
entrypoint = "parser"
source = "MATCH (n) RETURN n:A|:B&C"
expect = "reject"

[[case]]
id = "pattern-expression-boolean-control-positive"
description = "An unparenthesized pattern expression participates at boolean-primary precedence."
baseline = "accept"
entrypoint = "parser"
source = "RETURN (a)-->(b) OR true"
expect = "accept"

[[case]]
id = "pattern-expression-comparison-negative"
description = "An unparenthesized pattern expression cannot serve as a comparison predicand."
baseline = "reject"
entrypoint = "parser"
source = "RETURN (a)-->(b) = true"
expect = "reject"

[[case]]
id = "pattern-expression-arithmetic-negative"
description = "An unparenthesized pattern expression cannot serve as an arithmetic primary."
baseline = "reject"
entrypoint = "parser"
source = "RETURN (a)-->(b) + 1"
expect = "reject"

[[case]]
id = "parenthesized-pattern-arithmetic-control-positive"
description = "Parenthesizing a pattern value makes the parenthesized expression an arithmetic primary syntactically."
baseline = "accept"
entrypoint = "parser"
source = "RETURN ((a)-->(b)) + 1"
expect = "accept"

[[case]]
id = "with-all-identifier-positive"
description = "The non-reserved word ALL remains a binding-variable reference immediately after WITH."
baseline = "accept"
entrypoint = "parser"
source = "WITH all RETURN all"
expect = "accept"

[[case]]
id = "with-distinct-identifier-positive"
description = "The non-reserved word DISTINCT remains a binding-variable reference immediately after WITH."
baseline = "accept"
entrypoint = "parser"
source = "WITH distinct RETURN distinct"
expect = "accept"

[[case]]
id = "pattern-expression-node-parameter-properties-negative"
description = "A simple pattern expression rejects a bare parameter as node properties."
baseline = "reject"
entrypoint = "parser"
source = "RETURN (n $p)-->()"
expect = "reject"

[[case]]
id = "pattern-expression-relationship-parameter-properties-negative"
description = "A simple pattern expression rejects a bare parameter as relationship properties."
baseline = "reject"
entrypoint = "parser"
source = "RETURN (n)-[r $p]->()"
expect = "reject"

[[case]]
id = "pattern-comprehension-node-parameter-properties-negative"
description = "A pattern-comprehension source rejects a bare parameter as node properties."
baseline = "reject"
entrypoint = "parser"
source = "RETURN [(n $p)-->() | n]"
expect = "reject"

[[case]]
id = "pattern-comprehension-relationship-parameter-properties-negative"
description = "A pattern-comprehension source rejects a bare parameter as relationship properties."
baseline = "reject"
entrypoint = "parser"
source = "RETURN [(n)-[r $p]->() | n]"
expect = "reject"

[[case]]
id = "legacy-shortest-node-parameter-properties-negative"
description = "A legacy shortest-path expression rejects a bare parameter as node properties."
baseline = "reject"
entrypoint = "parser"
source = "RETURN shortestPath((n $p)-->(m))"
expect = "reject"

[[case]]
id = "legacy-shortest-relationship-parameter-properties-negative"
description = "A legacy shortest-path expression rejects a bare parameter as relationship properties."
baseline = "reject"
entrypoint = "parser"
source = "RETURN shortestPath((n)-[r $p]->(m))"
expect = "reject"
