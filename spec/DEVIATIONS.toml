baseline = "The BNF defines restricted merge graph-pattern families separately from general query graph patterns."
rationale = "The official TCK's syntax projection expects these forms to parse and classifies direction, type-cardinality, selector, and related update restrictions as compile-time semantic errors. The syntax parser therefore preserves the complete pattern for a later semantic-validation phase."
