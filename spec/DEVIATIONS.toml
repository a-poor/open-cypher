[[deviation]]
id = "OC2024-CREATE-PATTERN-SEMANTIC-BOUNDARY"
status = "accepted"
productions = ["create statement"]
kind = "syntax-semantic-validation-boundary"
summary = "Parse general pattern forms in CREATE and leave update restrictions to semantic validation."
baseline = "The BNF defines restricted create/merge graph-pattern families separately from general query graph patterns."
rationale = "The official TCK's syntax projection expects these forms to parse and classifies direction, type-cardinality, selector, and related update restrictions as compile-time semantic errors. The syntax parser therefore preserves the complete pattern for a later semantic-validation phase."
positive_case = "update-pattern-positive"
negative_case = "update-pattern-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#create-statement"

