# SPDX-License-Identifier: MIT OR Apache-2.0

schema_version = 2
baseline = "openCypher 2024.3 BNF"

# This is a policy ledger, not a conformance claim. `accepted` means the syntax is
# intentionally in scope. `open` records an observed difference whose disposition
# still needs review. Production references and executable cases are validated
# reciprocally against PRODUCTION_MAP.toml and WITNESSES.toml.

[[deviation]]
id = "OC2024-COUNT-COLLECT-SUBQUERIES"
status = "accepted"
productions = ["non-parenthesized value expression primary", "keyword"]
kind = "explicit-syntax-extension"
summary = "Accept COUNT and COLLECT subquery expressions alongside EXISTS."
baseline = "The 2024.3 BNF exposes only EXISTS as a subquery-valued expression primary."
rationale = "COUNT and COLLECT subqueries are explicit AST forms retained for the modern Cypher surface; COLLECT is one of the five non-baseline spellings intentionally exposed through the public Keyword token class."
positive_case = "count-collect-subquery-positive"
negative_case = "count-collect-subquery-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf"

[[deviation]]
id = "OC2024-EXPRESSION-MAP-PROJECTION-BASE"
status = "accepted"
productions = ["map projection"]
kind = "explicit-syntax-extension"
summary = "Accept an arbitrary expression as a map-projection base."
baseline = "The BNF map projection begins with a binding variable."
rationale = "The AST can preserve any expression base, enabling parenthesized and computed projection sources without ambiguity."
positive_case = "expression-map-projection-positive"
negative_case = "expression-map-projection-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#map-projection"

[[deviation]]
id = "OC2024-REPEATED-MERGE-ACTIONS"
status = "accepted"
productions = ["merge statement", "merge action"]
kind = "tck-over-bnf-clarification"
summary = "Accept more than one ON MATCH/ON CREATE action after MERGE."
baseline = "The BNF shows one optional merge action."
rationale = "The official TCK exercises the customary ON MATCH plus ON CREATE pair, and the AST stores the actions as an ordered list."
positive_case = "repeated-merge-action-positive"
negative_case = "repeated-merge-action-negative"
evidence = "vendor/openCypher-2024.3/tck/features/clauses/merge/Merge4.feature"
evidence_scenario = "Scenario: [1] Merge should be able to set labels on match and on create"

[[deviation]]
id = "OC2024-PATTERN-PARAMETER-PROPERTIES"
status = "accepted"
productions = ["graph pattern", "node pattern filler", "element pattern predicate", "element property specification", "relationship pattern filler", "merge node pattern filler", "merge relationship pattern filler", "merge node label and property set specification", "merge relationship label and property set specification", "merge element property specification", "subquery expression argument"]
kind = "syntax-semantic-validation-boundary"
summary = "Parse bare parameter property maps in graph, subquery, and update patterns, rather than only in CREATE."
baseline = "The BNF permits a general parameter as a CREATE element property specification, while query and MERGE element property specifications require a braced nonempty key/value map."
rationale = "The official TCK treats parameter use in MATCH and MERGE pattern predicates as the InvalidParameterUse compile-time semantic error, so the syntax frontend preserves the parameter for later validation in graph, subquery, and update patterns. Simple pattern expressions, comprehensions, and legacy shortest paths remain restricted to braced properties."
positive_case = "pattern-parameter-properties-extension-positive"
negative_case = "pattern-parameter-properties-boundary-negative"
evidence = "vendor/openCypher-2024.3/tck/features/clauses/match/Match1.feature"
evidence_scenario = "Scenario: [6] Fail when using parameter as node predicate in MATCH"

[[deviation]]
id = "OC2024-EMPTY-PATTERN-PROPERTY-MAPS"
status = "accepted"
productions = ["graph pattern", "simple path pattern", "legacy shortest path pattern", "node pattern filler", "element pattern predicate", "element property specification", "property key value pair list", "relationship pattern filler", "create node pattern filler", "create relationship pattern filler", "create node label and property set specification", "create relationship label and property set specification", "create element property specification", "merge node pattern filler", "merge relationship pattern filler", "merge node label and property set specification", "merge relationship label and property set specification", "merge element property specification", "pattern comprehension", "pattern source", "pattern expression", "subquery expression argument", "shortest path expression"]
kind = "tck-over-bnf-clarification"
summary = "Accept an empty braced property map on nodes and relationships throughout pattern syntax."
baseline = "The BNF element property specification contains a mandatory property-key/value-pair list, so `{}` has no baseline derivation."
rationale = "The official TCK uses empty node and relationship property maps inside otherwise syntactically valid patterns whose expected failures are semantic. Map-valued properties have an unambiguous empty AST representation, and the shared rule retains it in pattern expressions, comprehensions, and legacy shortest paths too."
positive_case = "empty-pattern-properties-extension-positive"
negative_case = "empty-pattern-properties-boundary-negative"
evidence = "vendor/openCypher-2024.3/tck/features/clauses/create/Create1.feature"
evidence_scenario = "Scenario: [18] Fail when adding new label predicate on a node that is already bound 4"

[[deviation]]
id = "OC2024-LEGACY-COLON-LABEL-PREDICATES"
status = "accepted"
productions = ["advanced comparison predicate part 2", "is labeled predicate part 2", "is label expression"]
kind = "tck-over-bnf-clarification"
summary = "Accept node- and relationship-style repeated-colon legacy forms in generic expression predicates."
baseline = "The BNF generic labeled predicate uses an IS/colon-prefixed boolean label expression; the repeated-colon legacy production is scoped to node patterns."
rationale = "The official TCK exercises `a:A:B` as a conjunctive label predicate. The shared legacy-label recognizer also accepts `a:A|:B`; both are normalized to explicit label-expression AST nodes, while mixtures of legacy `|:` and boolean operators remain rejected."
positive_case = "label-predicate-colon-chain-extension-positive"
negative_case = "label-predicate-legacy-boundary-negative"
evidence = "vendor/openCypher-2024.3/tck/features/expressions/graph/Graph5.feature"
evidence_scenario = "Scenario: [3] Conjunctive labels expression on nodes"

[[deviation]]
id = "OC2024-MODERN-UPDATE-LABEL-EXPRESSIONS"
status = "accepted"
productions = ["set labels item", "remove labels item"]
kind = "explicit-syntax-extension"
summary = "Accept boolean and IS label expressions in SET and REMOVE."
baseline = "The BNF update label-set productions allow repeated colon-prefixed label names only."
rationale = "The parser uses the modern explicit label-expression AST consistently for label predicates and label updates."
positive_case = "modern-update-labels-positive"
negative_case = "modern-update-labels-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#set-labels-item"

[[deviation]]
id = "OC2024-UPPERCASE-OCTAL-PREFIX"
status = "accepted"
productions = ["unsigned octal integer"]
kind = "lexical-alias"
summary = "Accept 0O as an uppercase alias for the BNF 0o octal prefix."
baseline = "The BNF spells the octal prefix with a lowercase o."
rationale = "Numeric radix prefixes are recognized case-insensitively, matching the hexadecimal prefix policy."
positive_case = "uppercase-octal-positive"
negative_case = "uppercase-octal-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#unsigned-octal-integer"

[[deviation]]
id = "OC2024-NESTED-UNARY-SIGNS"
status = "accepted"
productions = ["arithmetic unary"]
kind = "expression-extension"
summary = "Accept recursively nested unary plus and minus operators."
baseline = "The BNF arithmetic-unary production permits at most one optional sign."
rationale = "Recursive unary operators have conventional precedence, a direct AST representation, and no parsing ambiguity."
positive_case = "nested-unary-positive"
negative_case = "nested-unary-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#arithmetic-unary"

[[deviation]]
id = "OC2024-UNICODE-SCALAR-SAFETY"
status = "accepted"
productions = ["escaped character", "unicode escape value", "unicode 4 digit escape value", "unicode 6 digit escape value"]
kind = "representation-safety-restriction"
summary = "Reject surrogate and out-of-range Unicode escapes that cannot form Rust scalar values."
baseline = "The BNF constrains Unicode escapes by hexadecimal width and does not exclude surrogate code points."
rationale = "Rust String values contain Unicode scalar values, so accepting a surrogate would require storing an invalid or lossy character representation."
positive_case = "unicode-surrogate-rejected"
negative_case = "escaped-string-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#unicode-escape-value"

[[deviation]]
id = "OC2024-COMMENTS-AS-SEPARATORS"
status = "accepted"
productions = ["separator"]
kind = "practical-compatibility-extension"
summary = "Treat // line comments and nested /* block comments */ as trivia/separators."
baseline = "The 2024.3 BNF defines <separator> only as unicode: WHITESPACE and has no comment production."
rationale = "Comments are lexical trivia required by existing Cypher source compatibility and the lossless-token API; nested block comments are deliberately preserved by the lexer."
positive_case = "comments-positive"
negative_case = "comments-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#separator"

[[deviation]]
id = "OC2024-GQL-PATH-MODE-EXTENSIONS"
status = "accepted"
productions = ["path pattern prefix", "keyword"]
kind = "explicit-syntax-extension"
summary = "Accept WALK, TRAIL, SIMPLE, and ACYCLIC before a graph pattern."
baseline = "The openCypher 2024.3 BNF defines path selectors and PATH/PATHS keywords but does not define these four path-mode spellings."
rationale = "They are useful GQL-style compatibility extensions, represented explicitly in the AST, and intentionally exposed through the public Keyword token class rather than being confused with baseline identifiers."
positive_case = "path-mode-positive"
negative_case = "path-mode-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#path-pattern-prefix"

[[deviation]]
id = "OC2024-OPTIONAL-GRAPH-QUANTIFIER"
status = "accepted"
productions = ["graph pattern quantifier"]
kind = "explicit-syntax-extension"
summary = "Accept ? as the optional graph-pattern quantifier."
baseline = "The 2024.3 BNF graph-pattern quantifier permits *, +, and braced fixed/general quantifiers, but not ?."
rationale = "The parser and AST deliberately model the familiar optional quantifier alongside the other GQL-style graph quantifiers."
positive_case = "optional-quantifier-positive"
negative_case = "optional-quantifier-negative"
evidence = "vendor/openCypher-2024.3/grammar/openCypher.bnf#graph-pattern-quantifier"

[[deviation]]
